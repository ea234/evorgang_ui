
<app-statusbar-top
    [title]="fkAnwendung.appTitle"
    [icon]="fkAnwendung.appIcon"
    [isDark]="fkAnwendung.isDark"
    [user]="fkAnwendung.currentUser"
    (themeChanged)="onThemeChanged($event)"
    (logout)="onLogout()">
</app-statusbar-top>

@if (fkAnwendung.loginStatus === fkAnwendung.logged_none) {

    <app-login
        (loginSuccess)="onLoginSuccess($event)">
    </app-login>

} @else if (fkAnwendung.loginStatus === fkAnwendung.logged_in) {

    <app-application-selection
        [user]="fkAnwendung.currentUser!">
    </app-application-selection>

} @else if (fkAnwendung.loginStatus === fkAnwendung.logged_out) {

    <app-logout
        (backToLogin)="onBackToLogin()">
    </app-logout>

}
