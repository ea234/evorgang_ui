<app-statusbar-top
    [title]="appTitle"
    [icon]="appIcon"
    
    [isDark]="isDark"

    (themeChanged)="onThemeChanged($event)"    >
</app-statusbar-top>

@if (currentUser === null) {
        <app-login
        (loginSuccess)="onLoginSuccess($event)">
    </app-login>
} @else {

  <app-application-selection
        [user]="currentUser">
  </app-application-selection>

}
