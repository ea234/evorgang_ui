
<header class="statusbar">

    <div class="app-brand">
        <span class="brand-icon">{{ icon() }}</span>
        <span id="app-title">{{ title() }}</span>
    </div>

    <div class="statusbar-right">

        @if ( hasUser() ) {
            <span class="status-username" id="status-username" >
                {{ user() }}
            </span>

            <button
                type="button"
                class="logout-button"
                (click)="onLogout()">
                Abmelden
            </button>
        }
                
        <span class="status-label">Darstellung</span>

        <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Darstellung wechseln"
            aria-pressed="false"
            
            (click)="toggleTheme()"

            >
            <span id="theme-icon" >{{ isDarkMode() ? '&#9789;' : '&#9728;' }}</span>
            <span id="theme-label">{{ isDarkMode() ? 'Dunkel'  : 'Hell'    }}</span>
        </button>
    </div>
</header>
