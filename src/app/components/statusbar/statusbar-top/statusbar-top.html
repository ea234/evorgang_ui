
<header class="statusbar">
    <div class="app-brand">
        <span class="brand-icon">{{ icon }}</span>
        <span>{{ title }}</span>
    </div>

    <div class="statusbar-right">

        @if (user !== null) {
            <span class="status-username">
                {{ user.username }}
            </span>

            <button
                type="button"
                class="logout-button"
                (click)="onLogout()">
                Abmelden
            </button>
        }
                
        <span class="status-label">Darstellung</span>

        <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Darstellung wechseln"
            aria-pressed="false"
            
            (click)="toggleTheme()"

            >
            <span id="theme-icon" >{{ isDark ? '&#9789;' : '&#9728;' }}</span>
            <span id="theme-label">{{ isDark ? 'Dunkel'  : 'Hell'    }}</span>
        </button>
    </div>
</header>
